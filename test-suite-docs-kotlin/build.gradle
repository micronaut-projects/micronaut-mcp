plugins {
    id 'io.micronaut.build.internal.mcp-base'
    id 'io.micronaut.build.internal.kotlin-ksp'
}

// The examples of the guide, in Kotlin (JUnit 5), processed with KSP.
dependencies {
    kspTest(mn.micronaut.inject.kotlin)
    kspTest(mnJsonSchema.micronaut.json.schema.processor)
    kspTest(mnSerde.micronaut.serde.processor)
    kspTest(mnValidation.micronaut.validation.processor)

    testImplementation(projects.micronautMcpServerJavaSdk)
    testImplementation(mnJsonSchema.micronaut.json.schema.annotations)
    testImplementation(mnSerde.micronaut.serde.jackson)
    testImplementation(mnValidation.micronaut.validation)
    testImplementation(mn.micronaut.http.server.netty)
    testImplementation(mn.micronaut.http.client)
    testImplementation(mnTest.micronaut.test.junit5)
    testImplementation(libs.jsonassert)

    testRuntimeOnly(mnTest.junit.jupiter.engine)
    testRuntimeOnly(mnTest.junit.platform.launcher)
    testRuntimeOnly(mnLogging.logback.classic)
}

tasks.withType(Test).configureEach {
    useJUnitPlatform()
}
