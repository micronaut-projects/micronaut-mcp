plugins {
    id 'io.micronaut.build.internal.mcp-base'
    id 'io.micronaut.build.internal.java-base'
    id 'groovy'
}

// The examples of the guide, in Groovy (Spock). The Groovy compiler picks up the Micronaut
// type element visitors (JSON schema, serde, validation) from the compile classpath.
dependencies {
    testCompileOnly(mn.micronaut.inject.groovy)
    testCompileOnly(mnJsonSchema.micronaut.json.schema.processor)
    testCompileOnly(mnSerde.micronaut.serde.processor)
    testCompileOnly(mnValidation.micronaut.validation.processor)

    testImplementation(projects.micronautMcpServerJavaSdk)
    testImplementation(mnJsonSchema.micronaut.json.schema.annotations)
    testImplementation(mnSerde.micronaut.serde.jackson)
    testImplementation(mnValidation.micronaut.validation)
    testImplementation(mn.micronaut.http.server.netty)
    testImplementation(mn.micronaut.http.client)
    testImplementation(mnTest.micronaut.test.spock)
    testImplementation(libs.jsonassert)

    testRuntimeOnly(mnTest.junit.platform.launcher)
    testRuntimeOnly(mnLogging.logback.classic)
}

tasks.withType(Test).configureEach {
    useJUnitPlatform()
}
