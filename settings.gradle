pluginManagement {
    repositories {
        gradlePluginPortal()
        mavenCentral()
    }
}

plugins {
    id 'io.micronaut.build.shared.settings' version '8.1.4'
}

rootProject.name = 'micronaut-mcp-parent'
include 'micronaut-mcp'
include 'micronaut-mcp-annotations'
include 'micronaut-mcp-client-java-sdk'
include 'micronaut-mcp-server-java-sdk'
include 'micronaut-mcp-client-langchain4j'
include 'micronaut-mcp-bom'
include 'test-suite-graal'
include 'test-suite-moon'
include 'test-suite-jackson-databind'
include 'test-suite-mcp-http-tck'
include 'test-suite-mcp-http-tck-common'
include 'test-suite-mcp-http-tck-sync'
include 'test-suite-mcp-http-tck-async'
include 'test-suite-docs-java'
include 'test-suite-docs-kotlin'
include 'test-suite-docs-groovy'
include 'test-suite-docs-python'

enableFeaturePreview 'TYPESAFE_PROJECT_ACCESSORS'

micronautBuild {
    useStandardizedProjectNames.set(true)
    importMicronautCatalog()
    importMicronautCatalog("micronaut-serde")
    importMicronautCatalog("micronaut-security")
    importMicronautCatalog("micronaut-json-schema")
    importMicronautCatalog("micronaut-validation")
    importMicronautCatalog("micronaut-langchain4j")
}

// Micronaut core 5.3.0-SNAPSHOT comes from the Central snapshots repository. Maven local, where a core
// checkout publishes it with publishToMavenLocal, is only used when the build runs with -PuseMavenLocal, and
// then after the Central snapshots, so a locally published core never silently replaces the shared snapshot
// (publish a distinct version such as 5.3.0-mine-SNAPSHOT to test local core changes).
// Only io.micronaut snapshots are resolved from them. Projects that declare their own repositories replace the
// settings ones, so they are added to each project too. Remove once the build moves to a core 5.3 release.
def useMavenLocal = providers.gradleProperty('useMavenLocal').map { it != 'false' }.getOrElse(false)
def micronautSnapshotRepositories = { RepositoryHandler repositories ->
    repositories.maven {
        url = uri('https://central.sonatype.com/repository/maven-snapshots/')
        mavenContent {
            snapshotsOnly()
        }
        content {
            includeGroupByRegex('io\\.micronaut(\\..*)?')
        }
    }
    if (useMavenLocal) {
        repositories.mavenLocal {
            content {
                includeVersionByRegex('io\\.micronaut(\\..*)?', '.*', '.*-SNAPSHOT')
            }
        }
    }
}
dependencyResolutionManagement {
    micronautSnapshotRepositories(repositories)
    repositories {
        mavenCentral()
    }
}
gradle.beforeProject { project ->
    micronautSnapshotRepositories(project.repositories)
}
